<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#A8D92F" />
  <meta name="description" content="ScanBeforeEat - AI-Powered Food Ingredient Intelligence Platform. Understand packaged food labels, additives, allergens, and scientific evidence before you eat." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ScanBeforeEat" />
  
  <title>ScanBeforeEat — Food Ingredient Intelligence</title>

  <!-- PWA Web Manifest -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23A8D92F'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🥗%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='25' fill='%23A8D92F'/%3E%3Ctext x='50' y='65' font-size='50' text-anchor='middle'%3E🥗%3C/text%3E%3C/svg%3E" />

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css?v=3" />
  <link rel="stylesheet" href="/css/base.css?v=3" />
  <link rel="stylesheet" href="/css/components.css?v=3" />
  <link rel="stylesheet" href="/css/desktop-blocker.css?v=3" />

  <!-- Pre-bundled Local OCR Engine (Zero External Dependencies, Offline-First) -->
  <script src="/vendor/tesseract/tesseract.min.js"></script>
</head>
<body>

  <!-- =========================================================================
       1. Dedicated Desktop Blocker (Strictly shown at viewport width >= 600px)
       ========================================================================= -->
  <section id="desktop-blocker" aria-label="Desktop blocker screen">
    <div class="blocker-card">
      <div class="blocker-brand">
        <div class="blocker-logo-badge" style="display: flex; align-items: center; justify-content: center; color: #1A2805;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.5 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <div class="blocker-brand-name">ScanBeforeEat</div>
      </div>

      <div class="phone-graphic-container">
        <div class="css-phone">
          <div class="css-phone-notch"></div>
          <div class="css-phone-screen">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#789C18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <div class="scanner-laser"></div>
            <span style="font-size: 0.65rem; font-weight: 700; color: #789C18; margin-top: 4px;">SCANNING</span>
          </div>
        </div>
      </div>

      <h1 class="blocker-title">Made for your phone.</h1>
      <p class="blocker-text">
        Scan food labels, understand ingredients, and keep your food insights with you on the go. Open ScanBeforeEat on a mobile device for the best camera scanning experience.
      </p>

      <div class="qr-code-wrapper">
        <div id="blocker-qr-svg"></div>
        <div class="qr-subtext">Scan with your mobile camera</div>
      </div>

      <button type="button" class="copy-link-btn" id="copy-app-link-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy App Link
      </button>
    </div>
  </section>

  <!-- =========================================================================
       2. Mobile Application Root (Strictly presented at viewport <= 599px)
       ========================================================================= -->
  <div id="app-root">
    <!-- Top Mobile Header -->
    <header class="app-header" id="app-header">
      <div class="brand-wrapper" id="header-brand-btn" role="button" tabindex="0" aria-label="Go to home dashboard">
        <div class="brand-icon" style="color: #1A2805;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.5 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <span class="brand-title">ScanBeforeEat</span>
      </div>

      <div class="header-actions">
        <button type="button" class="header-avatar-btn" id="header-avatar-btn" aria-label="View profile and account settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic View Container -->
    <main class="view-container" id="view-content" role="main">
      <div style="text-align: center; padding: 3rem 1rem; color: var(--color-ink-muted);">
        Initializing ScanBeforeEat...
      </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav-bar" aria-label="Mobile navigation">
      <button type="button" class="nav-item active" data-tab="home" aria-label="Home Dashboard">
        <svg viewBox="0 0 24 24" fill="none"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>

      <!-- Prominent Center Scan Button -->
      <button type="button" class="nav-scan-button" data-tab="scan-hub" aria-label="Scan Food Label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
      </button>

      <button type="button" class="nav-item" data-tab="history" aria-label="Scan History">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </button>

      <button type="button" class="nav-item" data-tab="profile" aria-label="Profile and Settings">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="/js/app.js?v=7"></script>
</body>
</html>
