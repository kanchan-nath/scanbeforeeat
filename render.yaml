services:
  - type: web
    name: scanbeforeeat
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set this to your Aiven MySQL Service URI (or use individual DB_* variables)
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: AUTO_SEED
        value: "true"
      - key: AI_MOCK_MODE
        value: "true" # Set to false once you add your NVIDIA_API_KEY
      - key: NVIDIA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info

