services:
  # 1. Next.js Static Web Application (100% Free Tier, Zero Cold Start)
  - type: web
    name: scanbeforeeat-frontend
    runtime: static
    rootDir: frontend
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    staticPublishPath: out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://scanbeforeeat.com
      - key: NEXT_PUBLIC_API_URL
        value: https://scanbeforeeat-api.onrender.com/api

  # 2. Express TypeScript Toxicology & Billing API Server
  - type: web
    name: scanbeforeeat-api
    rootDir: server
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: ALLOWED_ORIGIN
        value: "*"
      # Optional: Cloud PostgreSQL connection string (e.g. Render Postgres or Neon)
      # If omitted, server automatically boots local zero-config SQLite database.
      - key: DATABASE_URL
        sync: false
      # Live Razorpay credentials (if omitted, falls back to test sandbox)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
