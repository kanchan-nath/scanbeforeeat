name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run linter
        run: npm run lint

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://scanbeforeeat.com"
          NEXT_PUBLIC_APP_URL: "https://app-scanbeforeeat.com"

      - name: Validate static export artifacts
        run: |
          test -f out/index.html || { echo "Missing out/index.html"; exit 1; }
          test -f out/sitemap.xml || { echo "Missing out/sitemap.xml"; exit 1; }
          test -f out/robots.txt || { echo "Missing out/robots.txt"; exit 1; }
          test -f out/about/index.html || { echo "Missing out/about/index.html"; exit 1; }
          test -f out/additives/index.html || { echo "Missing out/additives/index.html"; exit 1; }
          test -f out/methodology/index.html || { echo "Missing out/methodology/index.html"; exit 1; }
          test -f out/upf-guide/index.html || { echo "Missing out/upf-guide/index.html"; exit 1; }
          test -f out/blog/index.html || { echo "Missing out/blog/index.html"; exit 1; }
          test -f out/blog/ultra-processed-foods-hidden-truth/index.html || { echo "Missing dynamic blog post"; exit 1; }
          echo "Static export artifacts verified successfully."
